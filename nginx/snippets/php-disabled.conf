# Static / SPA mode (PHP_STATUS=0) - PHP-FPM is not running
# Copied to /home/container/tmp/php-mode.conf on startup by modules/nginx/start.sh.
# Do not include this file directly - edit your server block in nginx/conf.d/ instead.

# Serve static files; unknown paths fall back to index.html for client-side routing
# (Angular, React, Vue, ...). =404 avoids a rewrite loop if index.html is missing.
location / {
    try_files $uri $uri/ /index.html =404;
}

# Never serve PHP source code as plain text
location ~ \.php$ {
    return 404;
}
