name: Docker

on:
  # Manual run, e.g. to ship a security fix right away
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Full rebuild without cache'
        type: boolean
        default: false
  schedule:
    - cron: '24 9 * * *'
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [ '8.2', '8.3', '8.4', '8.5' ] # PHP versions to build

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Cache does not like upercase
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The registry cache never expires on its own. These values are passed as build args,
      # so the package layer is rebuilt as soon as one of them changes:
      # nginx and composer versions, cloudflared release tag, a hash over all Sury packages
      # of this PHP version (incl. extensions) and the month as fallback for Debian packages.
      - name: Check upstream versions
        id: versions
        env:
          PHP_VERSION: ${{ matrix.php-version }}
        run: |
          set -euo pipefail
          nginx=$(curl -fsSL https://nginx.org/packages/mainline/debian/dists/bookworm/nginx/binary-amd64/Packages \
            | awk '/^Package: nginx$/{f=1;next} f&&/^Version:/{print $2;f=0}' | sort -V | tail -1)
          php=$(curl -fsSL https://packages.sury.org/php/dists/bookworm/main/binary-amd64/Packages \
            | awk -v v="php${PHP_VERSION}" '/^Package: /{p=$2} /^Version: /{if (p == v || index(p, v "-") == 1) print p, $2}' \
            | sort | sha256sum | cut -c1-16)
          cloudflared=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/cloudflare/cloudflared/releases/latest | sed 's#.*/##')
          composer=$(curl -fsSL https://getcomposer.org/versions | jq -r '.stable[0].version')
          for name in nginx php cloudflared composer; do
            test -n "${!name}" || { echo "Could not determine $name version"; exit 1; }
          done
          {
            echo "nginx=$nginx"
            echo "php=$php"
            echo "cloudflared=$cloudflared"
            echo "composer=$composer"
            echo "month=$(date -u +%Y-%m)"
          } >> "$GITHUB_OUTPUT"
          echo "nginx=$nginx php-pkgs=$php cloudflared=$cloudflared composer=$composer"

      # Install the cosign tool except on PR
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 #v4.1.3
        with:
          cosign-release: 'v2.2.4'

      # Set up BuildKit Docker container builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login against a Docker registry except on PR
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            ${{ matrix.php-version }}-${{ github.sha }}
            ${{ matrix.php-version }}-latest
            ${{ matrix.php-version }}

      # Build and push Docker image with Buildx (don't push on PR)
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME_LC }}:buildcache-${{ matrix.php-version }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}:buildcache-{1},mode=max,image-manifest=true,oci-mediatypes=true', env.IMAGE_NAME_LC, matrix.php-version) || '' }}
          no-cache: ${{ inputs.no_cache == true }}
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            NGINX_VERSION=${{ steps.versions.outputs.nginx }}
            PHP_PKG_HASH=${{ steps.versions.outputs.php }}
            CLOUDFLARED_VERSION=${{ steps.versions.outputs.cloudflared }}
            COMPOSER_VERSION=${{ steps.versions.outputs.composer }}
            CACHE_MONTH=${{ steps.versions.outputs.month }}

      # Sign the resulting Docker image digest except on PRs.
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
